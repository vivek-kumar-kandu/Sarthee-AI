name: Sarthee AI Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Backend Unit & Integration Test Suite
        run: npm test
        working-directory: backend

      - name: Verify Readiness Probe Endpoint Code
        run: node --check src/api/v1/routes/health.routes.js
        working-directory: backend

  flutter-analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get
        working-directory: Sarthee_AI

      - name: Run Flutter Static Analysis
        run: flutter analyze
        working-directory: Sarthee_AI
